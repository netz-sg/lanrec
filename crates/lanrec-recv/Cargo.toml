[package]
name = "lanrec-recv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lanrec receiver -- writes an incoming stream to disk"

[lib]
name = "lanrec_recv"
path = "src/lib.rs"

[[bin]]
name = "lanrec-recv"
path = "src/main.rs"

# Only std, so this builds and runs on macOS and Linux as well as Windows.
[dependencies]
lanrec-wire = { path = "../lanrec-wire" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = "1.0.151"
socket2 = "0.6.5"
