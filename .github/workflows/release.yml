name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be rebuilt without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (sender, receiver, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Rust
        run: rustup update stable && rustup default stable

      # bindgen generates the NVENC bindings from the vendored headers and needs
      # libclang. The runner image ships LLVM, but not on PATH for bindgen.
      - name: Locate libclang
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Build sender and receiver
        run: cargo build --release -p lanrec-cli -p lanrec-recv

      - name: Test
        run: cargo test --release -p lanrec-core -p lanrec-wire -p lanrec-recv

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build sender app
        working-directory: app
        run: |
          npm ci
          npm run tauri build

      - name: Package
        shell: bash
        run: |
          mkdir -p dist out
          cp target/release/lanrec.exe dist/
          cp target/release/lanrec-recv.exe dist/
          cp README.md LICENSE NOTICE.md dist/
          7z a out/lanrec-windows-x86_64.zip ./dist/*

          # The installer lands under a version directory that changes with the
          # release, so find it rather than hardcoding the path. Uploaded as a
          # plain .exe: an installer inside a zip is one click too many.
          setup=$(find target/release/bundle/nsis -name "*-setup.exe" | head -1)
          if [ -z "$setup" ]; then
            echo "no NSIS installer produced" >&2
            exit 1
          fi
          cp "$setup" "out/lanrec-setup-windows-x64.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS receiver (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: apple-silicon
          - target: x86_64-apple-darwin
            label: intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-recv/package-lock.json

      # Only the receiver app. The sender needs Windows, D3D11 and an NVIDIA
      # GPU; nothing in this app touches any of that.
      - name: Build receiver app
        working-directory: app-recv
        run: |
          npm ci
          npm run tauri build -- --target ${{ matrix.target }}

      - name: Build headless receiver
        run: cargo build --release -p lanrec-recv --target ${{ matrix.target }}

      - name: Test
        run: cargo test --release -p lanrec-wire -p lanrec-recv

      - name: Package
        run: |
          mkdir -p out cli
          dmg=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$dmg" ]; then
            echo "no dmg produced" >&2
            exit 1
          fi
          cp "$dmg" "out/lanrec-receiver-macos-${{ matrix.label }}.dmg"

          cp target/${{ matrix.target }}/release/lanrec-recv cli/
          cp README.md LICENSE NOTICE.md cli/
          tar -czf "out/lanrec-recv-macos-${{ matrix.label }}.tar.gz" -C cli .
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  linux:
    name: Linux receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Rust
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build receiver
        run: cargo build --release -p lanrec-recv

      - name: Test
        run: cargo test --release -p lanrec-wire -p lanrec-recv

      - name: Package
        run: |
          mkdir -p out dist
          cp target/release/lanrec-recv dist/
          cp README.md LICENSE NOTICE.md dist/
          tar -czf out/lanrec-recv-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" -o -name "*.dmg" \) \
            -exec cp {} release/ \;
          ls -la release
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Notes are generated rather than kept in a file, so every release
      # describes the assets it actually shipped.
      - name: Notes
        run: |
          cat > notes.md <<'NOTES'
          Record a Windows gaming PC over a direct Ethernet link.

          ## Downloads

          **Gaming PC (Windows, NVIDIA)**

          | File | What it is |
          |---|---|
          | `lanrec-setup-windows-x64.exe` | Installer for the sender app, with live preview |
          | `lanrec-windows-x86_64.zip` | Command line: `lanrec.exe` and `lanrec-recv.exe` |

          **The machine that records**

          | File | What it is |
          |---|---|
          | `lanrec-receiver-macos-apple-silicon.dmg` | Receiver app for M1 and later |
          | `lanrec-receiver-macos-intel.dmg` | Receiver app for Intel Macs |
          | `lanrec-recv-macos-*.tar.gz` | Command line receiver |
          | `lanrec-recv-linux-x86_64.tar.gz` | Command line receiver for Linux |

          The receiver needs nothing but an OS and a disk. It never decodes; it
          writes what arrives.

          ## Getting started

          Open the receiver app, check the address and press **Empfang starten**.
          Then on the gaming PC:

          ```sh
          lanrec.exe nics                                  # which cable is which
          lanrec.exe send --to 10.0.0.2:9000 --via "Zum Mac" --seconds 600
          ```

          `--via` forces the stream onto one adapter instead of leaving the
          choice to the routing table, and fails loudly if it did not take.

          ## Unsigned builds

          Nothing here is code-signed or notarised yet.

          - **macOS** will refuse the app on first open. Right-click it in
            Finder and choose *Open*, or clear the flag:
            `xattr -dr com.apple.quarantine "/Applications/lanrec receiver.app"`
          - **Windows** SmartScreen will warn. *More info* then *Run anyway*.

          ## Known limitations

          Colour conversion is currently the driver's, there is no audio yet, and
          the bitrate estimate in the sender app is a model rather than a
          measurement. All open points are listed in the README.
          NOTES
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" \
              --title "lanrec $TAG" \
              --notes-file notes.md \
              --verify-tag \
              release/*
          fi
